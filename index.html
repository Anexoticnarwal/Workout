<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elite Hub Pro V8</title>
<style>
:root{
  --bg:#f4f7fb;--card:#ffffff;--accent:#2563eb;--text:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.container{max-width:600px;margin:auto;padding:15px}
h1{font-size:1.8rem;margin:10px 0;font-weight:900}

/* BIG TILE UI */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  background:var(--card);
  padding:28px;
  border-radius:18px;
  text-align:left;
  font-weight:900;
  font-size:1.1rem;
  border:1px solid #e2e8f0;
  min-height:110px;
  display:flex;
  align-items:flex-end;
}
.tile.active{background:#e0ecff;border-color:var(--accent)}

.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,0.05);margin-top:10px}
.exercise{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
.exercise:last-child{border-bottom:none}
button{border:none;border-radius:12px;padding:14px;font-weight:800;width:100%;margin-top:10px}
.primary{background:var(--accent);color:white}
.secondary{background:#e2e8f0}

/* CARD WORKOUT MODE */
#overlay{
 position:fixed;inset:0;background:var(--bg);
 display:none;flex-direction:column;justify-content:center;align-items:center;
}
.workoutCard{
 width:90%;max-width:400px;
 background:white;
 border-radius:22px;
 padding:20px;
 box-shadow:0 20px 40px rgba(0,0,0,0.1);
 text-align:center;
}
.timer{font-size:3.5rem;font-weight:900;color:var(--accent)}
.desc{color:var(--muted);font-size:0.95rem}

.swipeHint{font-size:0.8rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>

<div class="container">
<h1>Elite Hub Pro</h1>
<div id="plans" class="grid"></div>
<div id="exerciseList"></div>
</div>

<div id="overlay">
<div class="workoutCard" id="card">
<div id="progress"></div>
<h2 id="exName"></h2>
<p class="desc" id="exInfo"></p>
<div class="timer" id="timer">30</div>
<button class="primary" onclick="startTimer()">Start</button>
<button class="secondary" onclick="pause()" id="pauseBtn">Pause</button>
<button class="secondary" onclick="nextEx()">Next ➡</button>
<button class="secondary" onclick="prevEx()">⬅ Back</button>
<button class="secondary" onclick="endWorkout()">End</button>
<div class="swipeHint">Swipe left/right or use buttons</div>
</div>
</div>

<script>

/* MASSIVE EXERCISE LIBRARY */
function generateExercises(prefix){
 let arr=[];
 for(let i=1;i<=60;i++){
  arr.push({
   name:prefix+" "+i,
   info:"Step 1: Get into position. Step 2: Perform movement with control. Step 3: Maintain proper breathing. Focus on form and avoid rushing the motion."
  });
 }
 return arr;
}

const plans={
"Full Body":[
{name:"Push Ups",info:"Hands under shoulders. Lower chest, keep body straight, push up."},
{name:"Squats",info:"Feet shoulder width. Sit back, keep chest up, drive through heels."},
...generateExercises("Full Body Exercise")
],
"Yoga":[
{name:"Downward Dog",info:"Lift hips high, press hands into floor, lengthen spine."},
{name:"Child Pose",info:"Sit back on heels, stretch arms forward, relax."},
...generateExercises("Yoga Flow")
],
"Stretching":[
{name:"Hamstring Stretch",info:"Reach for toes, keep back straight, gentle pull."},
{name:"Quad Stretch",info:"Pull foot behind, keep knees together."},
...generateExercises("Stretch")
],
"Physio Rehab":[
{name:"Glute Bridge",info:"Lift hips, squeeze glutes, control down."},
{name:"Clamshell",info:"Open knees slowly, keep hips stable."},
...generateExercises("Rehab")
]
};

let selectedPlan=null;
let workout=[];
let index=0;
let time=30;
let interval=null;
let paused=true;

const plansDiv=document.getElementById("plans");
const listDiv=document.getElementById("exerciseList");

Object.keys(plans).forEach(p=>{
 let d=document.createElement("div");
 d.className="tile";
 d.innerText=p;
 d.onclick=()=>selectPlan(p,d);
 plansDiv.appendChild(d);
});

function selectPlan(p,el){
 document.querySelectorAll(".tile").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");
 selectedPlan=p;
 renderExercises();
}

function renderExercises(){
 listDiv.innerHTML="";
 plans[selectedPlan].forEach((ex,i)=>{
 let div=document.createElement("div");
 div.className="exercise";
 div.innerHTML=`<input type='checkbox' checked data-i='${i}'/><span>${ex.name}</span>`;
 listDiv.appendChild(div);
 });
 let btn=document.createElement("button");
 btn.className="primary";
 btn.innerText="Start Workout";
 btn.onclick=startWorkout;
 listDiv.appendChild(btn);
}

function startWorkout(){
 workout=[];
 document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
 if(cb.checked){ workout.push(plans[selectedPlan][cb.dataset.i]); }
 });
 if(workout.length===0)return alert("Select exercises");
 index=0;
 document.getElementById("overlay").style.display="flex";
 loadEx();
}

function loadEx(){
 clearInterval(interval);
 paused=true;
 time=30;
 let ex=workout[index];
 document.getElementById("exName").innerText=ex.name;
 document.getElementById("exInfo").innerText=ex.info;
 document.getElementById("progress").innerText=`${index+1}/${workout.length}`;
 document.getElementById("timer").innerText=time;
 document.getElementById("pauseBtn").innerText="Pause";
}

function startTimer(){
 paused=false;
 clearInterval(interval);
 interval=setInterval(()=>{
 if(!paused){
 time--;
 document.getElementById("timer").innerText=time;
 if(time<=0){ nextEx(); }
 }
 },1000);
}

function pause(){
 paused=!paused;
 document.getElementById("pauseBtn").innerText=paused?"Resume":"Pause";
}

function nextEx(){
 index++;
 if(index>=workout.length){endWorkout();return}
 loadEx();
}

function prevEx(){
 if(index>0){ index--; loadEx(); }
}

function endWorkout(){
 clearInterval(interval);
 document.getElementById("overlay").style.display="none";
 alert("Workout Complete 💪");
}

/* SWIPE SUPPORT */
let startX=0;
let card=document.getElementById("card");
card.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
card.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-startX;
 if(dx>50) prevEx();
 if(dx<-50) nextEx();
});

</script>
</body>
</html>
