<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elite Hub Pro V7</title>
<style>
:root{
  --bg:#f4f7fb;--card:#ffffff;--accent:#2563eb;--text:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.container{max-width:600px;margin:auto;padding:15px}
h1{font-size:1.6rem;margin:10px 0;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);padding:16px;border-radius:14px;text-align:center;font-weight:800;border:1px solid #e2e8f0;transition:0.2s}
.tile.active{background:#e0ecff;border-color:var(--accent);transform:scale(1.03)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,0.05);margin-top:10px}
.exercise{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
.exercise:last-child{border-bottom:none}
button{border:none;border-radius:12px;padding:14px;font-weight:800;width:100%;margin-top:10px}
.primary{background:var(--accent);color:white}
.secondary{background:#e2e8f0}
#overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.timer{font-size:4rem;font-weight:900;color:var(--accent)}
.phase{font-size:0.9rem;color:var(--muted);margin-top:5px}
.progressBar{height:6px;background:#e2e8f0;border-radius:10px;margin-top:10px;overflow:hidden}
.progressFill{height:100%;background:var(--accent);width:0%}
</style>
</head>
<body>
<div class="container">
<h1>Elite Hub Pro</h1>
<div id="plans" class="grid"></div>
<div id="exerciseList"></div>
</div>

<div id="overlay">
<div class="card" style="width:100%;max-width:400px">
<div id="progressText" style="font-size:0.8rem;color:var(--muted)"></div>
<h2 id="exName"></h2>
<p id="exInfo"></p>
<div class="timer" id="timer">30</div>
<div class="phase" id="phase">WORK</div>
<div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
<button class="primary" onclick="pause()" id="pauseBtn">Pause</button>
<button class="secondary" onclick="nextEx()">Skip</button>
<button class="secondary" onclick="endWorkout()">End</button>
</div>
</div>

<script>
const plans={
"Full Body":[
{name:"Push Ups",info:"Keep body straight, lower chest, push up"},
{name:"Squats",info:"Sit back, knees over toes, stand up"},
{name:"Plank",info:"Hold straight body, tighten core"},
{name:"Lunges",info:"Step forward, lower hips, switch legs"},
{name:"Burpees",info:"Drop, jump back, push up, jump"}
],
"Yoga":[
{name:"Downward Dog",info:"Lift hips, press hands down"},
{name:"Child Pose",info:"Sit back, stretch arms forward"},
{name:"Cobra",info:"Lift chest, keep hips down"}
]
};

let selectedPlan=null;
let workout=[];
let index=0;
let time=30;
let interval=null;
let paused=false;
let isRest=false;
let totalTime=30;

const plansDiv=document.getElementById("plans");
const listDiv=document.getElementById("exerciseList");

Object.keys(plans).forEach(p=>{
 let d=document.createElement("div");
 d.className="tile";
 d.innerText=p;
 d.onclick=()=>selectPlan(p,d);
 plansDiv.appendChild(d);
});

function selectPlan(p,el){
 document.querySelectorAll(".tile").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");
 selectedPlan=p;
 renderExercises();
}

function renderExercises(){
 listDiv.innerHTML="";
 plans[selectedPlan].forEach((ex,i)=>{
 let div=document.createElement("div");
 div.className="exercise";
 div.innerHTML=`<input type='checkbox' checked data-i='${i}'/><span>${ex.name}</span>`;
 listDiv.appendChild(div);
 });
 let btn=document.createElement("button");
 btn.className="primary";
 btn.innerText="Start Workout";
 btn.onclick=startWorkout;
 listDiv.appendChild(btn);
}

function startWorkout(){
 workout=[];
 document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
 if(cb.checked){
 workout.push(plans[selectedPlan][cb.dataset.i]);
 }
 });
 if(workout.length===0)return alert("Select exercises");
 index=0;
 document.getElementById("overlay").style.display="flex";
 loadEx();
}

function loadEx(){
 clearInterval(interval);
 paused=false;
 isRest=false;
 time=30;
 totalTime=30;
 let ex=workout[index];
 document.getElementById("exName").innerText=ex.name;
 document.getElementById("exInfo").innerText=ex.info;
 document.getElementById("progressText").innerText=`${index+1}/${workout.length}`;
 document.getElementById("phase").innerText="WORK";
 updateTimer();

 interval=setInterval(tick,1000);
}

function tick(){
 if(paused) return;
 time--;
 updateTimer();
 updateProgress();
 if(time<=0){
 if(!isRest){ startRest(); }
 else{ nextEx(); }
 }
}

function startRest(){
 isRest=true;
 time=10;
 totalTime=10;
 document.getElementById("phase").innerText="REST";
}

function updateTimer(){
 document.getElementById("timer").innerText=time;
}

function updateProgress(){
 let percent=((totalTime-time)/totalTime)*100;
 document.getElementById("progressFill").style.width=percent+"%";
}

function pause(){
 paused=!paused;
 document.getElementById("pauseBtn").innerText=paused?"Resume":"Pause";
}

function nextEx(){
 index++;
 if(index>=workout.length){endWorkout();return}
 loadEx();
}

function endWorkout(){
 clearInterval(interval);
 document.getElementById("overlay").style.display="none";
 alert("Workout Complete 💪");
}
</script>
</body>
</html>
