<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elite Hub Pro V4.1</title>
<style>
:root{--accent:#2563eb;--bg:#f8fafc}
html,body{min-height:100%;margin:0;padding:15px;background:var(--bg);overflow-x:hidden;}
body{font-family:system-ui;}
.container{max-width:650px;margin:auto}
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;padding:14px;border-radius:10px;text-align:center;font-weight:700;cursor:pointer;border:1px solid #ddd}
.tile.selected{background:#dbeafe;border-color:var(--accent)}
.ex-item{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px;margin-bottom:6px;border-radius:8px;border:1px solid #ddd}
.controls{display:flex;gap:5px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;margin-top:10px;font-weight:700}
.btn-main{background:var(--accent);color:white}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;min-height:100%;touch-action:none;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;padding:15px;box-sizing:border-box}
#timer{font-size:64px}
.small{font-size:12px;opacity:.7}
input[type=number]{width:60px;}
</style>
</head>
<body>
<div class="container">
<h1>ELITE HUB PRO V4.1</h1>
<div id="tiles" class="tile-grid"></div>

<div id="selection-zone" style="display:none">
<h3>Select + Customize</h3>
<div id="exercise-list"></div>
<label>Exercise Time: <input id="exTime" type="number" inputmode="numeric" pattern="[0-9]*" value="60"></label>
<label>Rest Time: <input id="restTime" type="number" inputmode="numeric" pattern="[0-9]*" value="15"></label>
<button class="btn btn-main" onclick="startWorkout()">START</button>
</div>

<h3>Saved Workouts</h3>
<div id="saved"></div>
</div>

<div id="overlay" class="overlay">
<div id="progress" class="small"></div>
<h2 id="name"></h2>
<div id="timer">60</div>
<div id="phase" class="small"></div>
<button class="btn" onclick="togglePause()">Pause</button>
<button class="btn" onclick="skip()">Skip</button>
<button class="btn" onclick="end()">End</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
// categories
const cats=["Strength","Cardio","Core","Mobility","Rehab","Yoga"];
let all=[];
cats.forEach(c=>{for(let i=1;i<=25;i++){all.push({name:c+" Move "+i,cat:c});}});

// plans
const plans={};
let names=["Full","Strength","Cardio","HIIT","Core","Yoga","Pilates","Stretch","Rehab","Bands","Athletic","Endurance","Explosive","Mobility","Beginner","Advanced","Upper","Lower","Balance","Recovery"];
names.forEach((n,i)=>{plans[n]=all.slice(i*5,i*5+20);});

let selected=null,session=[],i=0,timer=60,int=null,paused=false,isRest=false;

// UI
const tiles=document.getElementById('tiles');
Object.keys(plans).forEach(p=>{
 let d=document.createElement('div');
 d.className='tile';
 d.innerText=p;
 d.onclick=()=>{select(p,d)};
 tiles.appendChild(d);
});

function select(p,el){document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected')); el.classList.add('selected'); selected=p; render();}

function render(){
 let list=document.getElementById('exercise-list');
 document.getElementById('selection-zone').style.display='block';
 list.innerHTML='';
 plans[selected].forEach((e,idx)=>{
  let div=document.createElement('div');
  div.className='ex-item';
  div.innerHTML=`<span>${e.name} (${e.cat})</span>
  <div class='controls'>
  <button onclick='up(${idx})'>↑</button>
  <button onclick='down(${idx})'>↓</button>
  <input type='checkbox' checked value='${idx}'>
  </div>`;
  list.appendChild(div);
 });
}

function up(x){if(x===0)return;let a=plans[selected];[a[x-1],a[x]]=[a[x],a[x-1]];render();}
function down(x){let a=plans[selected];if(x===a.length-1)return;[a[x+1],a[x]]=[a[x],a[x+1]];render();}

function startWorkout(){
 let items=document.querySelectorAll('.ex-item');
 session=[...items].filter(i=>i.querySelector('input').checked).map(i=>plans[selected][i.querySelector('input').value]);
 if(!session.length)return alert('Select exercises');
 try{localStorage.setItem('savedWorkout',JSON.stringify(session));}catch(e){console.warn('LocalStorage blocked:',e);}
 i=0; isRest=false;
 document.getElementById('overlay').style.display='flex';
 load();
}

function load(){
 clearInterval(int); paused=false;
 let exTime=+document.getElementById('exTime').value;
 let restTime=+document.getElementById('restTime').value;
 timer=isRest?restTime:exTime;
 document.getElementById('name').innerText=isRest?'REST':session[i].name;
 document.getElementById('phase').innerText=isRest?'Rest':'Work';
 document.getElementById('progress').innerText=`${i+1}/${session.length}`;
 update();
 int=setInterval(run,1000);
}

function run(){
 if(paused)return;
 timer--; update();
 if(timer<=0){
  if(!isRest){isRest=true;load();}
  else{
   isRest=false;
   if(i<session.length-1){i++;load();} else{alert('Workout Complete'); end();}
  }
 }
}

function update(){document.getElementById('timer').innerText=timer;}
function togglePause(){paused=!paused;}
function skip(){i++;if(i>=session.length)return end(); load();}
function end(){clearInterval(int);document.getElementById('overlay').style.display='none';}

// saved workouts
const savedDiv=document.getElementById('saved');
let saved=JSON.parse(localStorage.getItem('savedWorkout')||'[]');
savedDiv.innerText=saved.length?`Last: ${saved.length} exercises saved`:'';
});
</script>
</body>
</html>
