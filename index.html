<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Training Hub</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Grid Tiles */
        .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
        .tile { background: white; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #e2e8f0; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; transition: 0.2s; }
        .tile.selected { border-color: var(--accent); background: #eff6ff; box-shadow: 0 0 0 2px var(--accent); }

        /* Selection List */
        .selection-list { margin-top: 20px; display: none; }
        .ex-row { background: white; padding: 15px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #e2e8f0; }
        .ex-row input { width: 20px; height: 20px; margin-right: 15px; accent-color: var(--accent); }

        /* Immersive Overlay */
        #timer-overlay { 
            display: none; position: fixed; inset: 0; background: #0f172a; color: white; 
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; touch-action: none; /* Crucial fix for mobile swipe */
        }
        .workout-card { background: #1e293b; width: 100%; max-width: 400px; border-radius: 24px; padding: 1.5rem; text-align: center; border: 1px solid #334155; }
        .visual-box { width: 100%; aspect-ratio: 1/1; background: #fff; border-radius: 16px; margin-bottom: 15px; overflow: hidden; }
        .visual-box img { width: 100%; height: 100%; object-fit: cover; }
        
        #timer-display { font-size: 5rem; font-weight: 900; color: #38bdf8; margin: 10px 0; }
        .ctrl-row { display: flex; gap: 10px; width: 100%; margin: 15px 0; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
        .p-btn { background: #f59e0b; color: white; }
        .r-btn { background: #64748b; color: white; }
        .start-btn { background: var(--accent); color: white; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="font-weight: 900; letter-spacing: -1px;">ELITE HUB</h1>
    <div class="tile-grid" id="category-tiles"></div>

    <div id="selection-zone" class="selection-list">
        <h3 style="font-size: 0.9rem; opacity: 0.6;">SELECT EXERCISES:</h3>
        <div id="exercise-options"></div>
        <button class="btn start-btn" onclick="startCircuit()">▶ START SESSION</button>
    </div>
</div>

<div id="timer-overlay">
    <div class="workout-card">
        <h2 id="card-name" style="margin: 0 0 10px 0; text-transform: uppercase;">---</h2>
        <div class="visual-box"><img id="ex-gif" src="" alt="Demo"></div>
        <div id="timer-display">00</div>
        <div class="ctrl-row">
            <button id="pause-btn" class="btn p-btn" onclick="togglePause()">PAUSE</button>
            <button class="btn r-btn" onclick="resetTimer()">RESET</button>
        </div>
        <div style="font-size: 0.75rem; opacity: 0.6; text-align: left;" id="card-tip">---</div>
    </div>
    <p style="font-size: 0.6rem; opacity: 0.4; margin-top: 20px;">SWIPE LEFT/RIGHT TO NAVIGATE</p>
    <button style="margin-top: 20px; background:none; border:none; color:#ef4444; font-weight:700;" onclick="exitTimer()">EXIT</button>
</div>

<script>
    const lib = {
        strength: { title: "Strength", items: [
            { name: "Bench Press", time: 60, gif: "https://giphy.com", tip: "Drive feet into floor." },
            { name: "Deadlift", time: 45, gif: "https://giphy.com", tip: "Keep back flat." }
        ]},
        rehab: { title: "Physio Rehab", items: [
            { name: "Glute Bridges", time: 45, gif: "https://giphy.com", tip: "Squeeze glutes at top." },
            { name: "Dead Bug", time: 60, gif: "https://giphy.com", tip: "Press lower back down." }
        ]},
        yoga: { title: "Yoga Flow", items: [{ name: "Downward Dog", time: 60, gif: "https://giphy.com", tip: "Heels toward floor." }]}
        // Add more plans here...
    };

    let selectedKey = null, currentSession = [], currentIndex = 0, timerInt, timeLeft, isPaused = false, startX = 0;

    // --- Tile Builder ---
    const grid = document.getElementById('category-tiles');
    Object.keys(lib).forEach(key => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerText = lib[key].title;
        t.onclick = () => {
            document.querySelectorAll('.tile').forEach(el => el.classList.remove('selected'));
            t.classList.add('selected');
            selectedKey = key;
            showSelection(key);
        };
        grid.appendChild(t);
    });

    function showSelection(key) {
        const zone = document.getElementById('selection-zone');
        const options = document.getElementById('exercise-options');
        zone.style.display = 'block';
        options.innerHTML = lib[key].items.map((ex, i) => `
            <div class="ex-row">
                <input type="checkbox" checked value="${i}">
                <span><strong>${ex.name}</strong> (${ex.time}s)</span>
            </div>
        `).join('');
    }

    async function startCircuit() {
        const checks = document.querySelectorAll('#exercise-options input:checked');
        currentSession = Array.from(checks).map(c => lib[selectedKey].items[c.value]);
        if(!currentSession.length) return alert("Select at least one!");
        
        currentIndex = 0;
        document.getElementById('timer-overlay').style.display = 'flex';
        loadCard();
    }

    function loadCard() {
        clearInterval(timerInt);
        const ex = currentSession[currentIndex];
        document.getElementById('card-name').innerText = ex.name;
        document.getElementById('ex-gif').src = ex.gif;
        document.getElementById('card-tip').innerText = `TIP: ${ex.tip}`;
        timeLeft = ex.time;
        isPaused = false;
        updateDisplay();
        startTimer();
    }

    function startTimer() {
        timerInt = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) clearInterval(timerInt);
            }
        }, 1000);
    }

    function togglePause() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? "RESUME" : "PAUSE"; }
    function resetTimer() { timeLeft = currentSession[currentIndex].time; updateDisplay(); }
    function updateDisplay() { document.getElementById('timer-display').innerText = timeLeft; }

    // --- Fixed Mobile Swipe ---
    const overlay = document.getElementById('timer-overlay');
    overlay.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
    overlay.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 80) { // Threshold for swipe
            if (diff > 0 && currentIndex < currentSession.length - 1) { currentIndex++; loadCard(); }
            else if (diff < 0 && currentIndex > 0) { currentIndex--; loadCard(); }
        }
    }, {passive: true});

    function exitTimer() { clearInterval(timerInt); document.getElementById('timer-overlay').style.display = 'none'; }
</script>
</body>
</html>
